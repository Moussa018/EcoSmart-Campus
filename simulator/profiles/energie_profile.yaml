# ====================================================================
# EcoSmart Campus - Profil Simulateur Énergie (Sprint 1 - T04 / RNF3)
# ====================================================================

module: "energie"
unite: "kWh"
frequence_publication_secondes: 5

# Coefficients saisonniers mensuels (Janvier -> Décembre)
# Hiver : chauffage et éclairage plus intenses
# Printemps/Automne : consommation modérée
# Été : fermeture partielle du campus
saisons:
  1: 1.40   # Janvier (Hiver fort)
  2: 1.35   # Février
  3: 1.15   # Mars
  4: 0.95   # Avril
  5: 0.85   # Mai
  6: 0.75   # Juin
  7: 0.45   # Juillet (Vacances été)
  8: 0.40   # Août (Fermeture)
  9: 1.05   # Septembre (Rentrée)
  10: 1.15  # Octobre
  11: 1.30  # Novembre
  12: 1.45  # Décembre (Froid + éclairage)

# Profil horaire en semaine (0h à 23h) - Coefficient multiplicateur du talon
# Talon de nuit (0h-6h) : 1.0
# Montée en charge (7h-8h) : 2.5 - 3.8
# Cours / Pleine activité (8h-12h) : 4.5 - 5.5
# Pause déjeuner (12h-13h) : 3.8
# Cours après-midi (13h-18h) : 4.8 - 5.2
# Fin des cours (18h-20h) : 2.2
# Fermeture et veille (20h-23h) : 1.2
profil_horaire_semaine:
  0: 1.0
  1: 0.95
  2: 0.95
  3: 0.95
  4: 1.0
  5: 1.1
  6: 1.5
  7: 2.8
  8: 4.8
  9: 5.4
  10: 5.6
  11: 5.2
  12: 3.8
  13: 4.9
  14: 5.3
  15: 5.4
  16: 5.1
  17: 4.2
  18: 3.0
  19: 2.1
  20: 1.5
  21: 1.2
  22: 1.1
  23: 1.0

# Facteur week-end (Samedi & Dimanche) : activités réduites, pas de cours magistraux
facteur_weekend:
  samedi: 0.35
  dimanche: 0.20

# Capteurs déployés pour le module Énergie
