name: CI EcoSmart Campus

on:
  push:
    branches: [ main, develop, "feat/*", "task/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality:
    name: Backend Quality (Ruff & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v --junitxml=pytest-report.xml

  docker-build:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config
