# Mosquitto Broker Configuration for EcoSmart Campus (Sprint 1 - T05)

# Standard MQTT listener
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener (for direct browser/frontend connections or WebSocket relay)
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
